<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Desktop-optimized viewport - no mobile scaling restrictions -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=3.0, user-scalable=yes" />
    <title>Planetary Chess • AI Cyber Stewie - Desktop Edition</title>
    
    <!-- Desktop-specific meta tags -->
    <meta name="description" content="Planetary Chess - Desktop optimized AI chess game with futuristic interface" />
    <meta name="keywords" content="chess, AI, desktop, game, strategy, planetary" />
    <meta name="author" content="Planetary Chess Team" />
    
    <!-- Preload fonts for better desktop performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
      .text-shadow-lg {
        text-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
      }
      
      /* Desktop-optimized global styles */
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #050c17;
        color: #e2f1ff;
        overflow-x: hidden;
        /* Desktop-specific: Prevent text selection on UI elements */
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        /* Desktop-specific: Smooth scrolling */
        scroll-behavior: smooth;
      }

      /* Desktop-optimized scrollbar styling */
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      
      ::-webkit-scrollbar-track {
        background: #0c1b30;
        border-radius: 6px;
      }
      
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(135deg, #056df5 0%, #00a2ff 100%);
        border-radius: 6px;
        border: 2px solid #0c1b30;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(135deg, #0660d4 0%, #0085d4 100%);
      }

      ::-webkit-scrollbar-corner {
        background: #0c1b30;
      }

      /* Desktop-specific: Enhanced animation keyframes */
      @keyframes glow {
        0% { box-shadow: 0 0 10px rgba(0, 195, 255, 0.3); }
        50% { box-shadow: 0 0 20px rgba(0, 195, 255, 0.6); }
        100% { box-shadow: 0 0 10px rgba(0, 195, 255, 0.3); }
      }

      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }

      /* Desktop-specific: Cursor enhancements */
      .clickable {
        cursor: pointer;
      }

      .draggable {
        cursor: grab;
      }

      .draggable:active {
        cursor: grabbing;
      }

      /* Desktop-specific: Focus styles for keyboard navigation */
      *:focus {
        outline: 2px solid #00a2ff;
        outline-offset: 2px;
      }

      /* Desktop-specific: Disable mobile tap highlights */
      * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Desktop-specific initialization
      window.__DESKTOP_MODE__ = true;
      window.__MOBILE_MODE__ = false;
      
      // Desktop-specific: Prevent context menu on right-click for game elements
      document.addEventListener('contextmenu', function(e) {
        if (e.target.closest('.game-area, .chessboard')) {
          e.preventDefault();
        }
      });
      
      // Desktop-specific: Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        // F11 for fullscreen
        if (e.key === 'F11') {
          e.preventDefault();
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
          } else {
            document.exitFullscreen();
          }
        }
      });
    </script>
  </body>
</html>
