<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#061224"/>
      <stop offset="100%" style="stop-color:#0a1c34"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00c3ff"/>
      <stop offset="100%" style="stop-color:#7cbdff"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" fill="url(#bg)" rx="32"/>
  
  <!-- Chess pieces silhouettes -->
  <g fill="url(#glow)" opacity="0.8">
    <!-- King -->
    <path d="M80 180h16v-20h8v-8h-8v-8h-8v8h-8v8h8v20z"/>
    <rect x="76" y="180" width="24" height="8"/>
    
    <!-- Queen -->
    <path d="M140 180h16v-24l4-4 4 4v24h4v-32l-6-6h-20l-6 6v32h4z"/>
    <rect x="136" y="180" width="24" height="8"/>
    
    <!-- Planet/Chess board pattern -->
    <circle cx="128" cy="100" r="40" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.6"/>
    <circle cx="128" cy="100" r="24" fill="none" stroke="url(#glow)" stroke-width="1" opacity="0.4"/>
    
    <!-- Stars -->
    <circle cx="60" cy="60" r="2" fill="url(#glow)"/>
    <circle cx="200" cy="70" r="1.5" fill="url(#glow)"/>
    <circle cx="190" cy="200" r="2" fill="url(#glow)"/>
    <circle cx="40" cy="180" r="1" fill="url(#glow)"/>
  </g>
  
  <!-- Title -->
  <text x="128" y="230" text-anchor="middle" fill="url(#glow)" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    PLANETARY CHESS
  </text>
</svg>